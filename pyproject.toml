[project]
name = "behavioral-ai"
version = "0.1.0"
description = "Behavioral economics AI interviewer prototype"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "graphviz>=0.20",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.scripts]
behavioral-ai = "behavioral_ai.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/behavioral_ai"]
