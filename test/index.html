<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interview UI - Local Test</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: sans-serif; background: #f0f2f5; display: flex; min-height: 100vh; }

  /* ── Left: chat panel ── */
  #left {
    width: 55%;
    min-width: 380px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  h1 { font-size: 20px; color: #1e3a5f; }

  /* toolbar */
  #toolbar {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  #toolbar label { font-size: 14px; color: #555; }
  #toolbar select, #toolbar input {
    font-size: 14px;
    padding: 4px 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  #resetBtn {
    margin-left: auto;
    padding: 5px 14px;
    background: #e74c3c;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
  }

  /* Qualtrics-like chat container */
  .chat-container {
    width: 100%;
    background: #fff;
    display: flex;
    flex-direction: column;
    padding: 1px;
    height: 600px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  #chatArea {
    overflow-y: scroll;
    height: calc(100% - 200px);
    margin-bottom: 5px;
    border: 2px solid #ddd;
    border-radius: 5px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }
  .input-container { position: relative; margin-top: 5px; }
  #inputBox {
    width: 100%;
    resize: vertical;
    font-size: 18px;
    min-height: 100px;
    max-height: 120px;
    border: 2px solid #A9A9A9;
    border-radius: 10px;
    padding: 10px;
    overflow: auto;
  }
  .submit-button-container {
    display: flex;
    justify-content: flex-end;
    padding-top: 10px;
    align-items: center;
  }
  .submit-hint {
    flex-grow: 1;
    font-size: 16px;
    border: none;
    height: 30px;
    line-height: 1.2;
    padding-left: 10px;
    color: rgb(53,53,53);
  }
  #submitButton {
    background-color: #007AC0;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 18px;
  }
  #submitButton:disabled { background: #ccc; cursor: default; }

  /* ── Right: session data panel ── */
  #right {
    width: 45%;
    padding: 24px 24px 24px 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow: hidden;
  }
  #right h2 { font-size: 16px; color: #1e3a5f; }
  #sessionPanel {
    flex: 1;
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    overflow-y: auto;
    padding: 14px;
    font-size: 13px;
    font-family: monospace;
    white-space: pre-wrap;
    color: #222;
  }
  #modeTag {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
    background: #2563a8;
    color: white;
  }
  #modeTag.demo { background: #16a34a; }
</style>
</head>
<body>

<div id="left">
  <h1>Interview UI – Local Test</h1>

  <div id="toolbar">
    <label>Mode:</label>
    <select id="modeSelect">
      <option value="demo">Demo (mock API)</option>
      <option value="live">Live (localhost:8000)</option>
    </select>
    <span id="modeTag" class="demo">DEMO</span>

    <label style="margin-left:10px;">Endpoint:</label>
    <input id="endpointInput" value="http://localhost:8000" style="width:180px;" />

    <button id="resetBtn">↺ Reset</button>
  </div>

  <!-- same HTML as Qualtrics/without_voice/Qualtrics.html -->
  <div class="chat-container">
    <div id="chatArea" class="chat-area">&nbsp;</div>
    <div class="input-container">
      <textarea id="inputBox" placeholder="Type your message here..." maxlength="3000"></textarea>
    </div>
    <div class="submit-button-container">
      <div class="submit-hint">Please write full sentences.</div>
      <button id="submitButton">Submit response</button>
    </div>
  </div>
</div>

<div id="right">
  <h2>Session state</h2>
  <div id="sessionPanel">Waiting for first message...</div>
</div>

<script>
// ─────────────────────────────────────────────
//  DEMO MOCK API
//  Simulates a 2-topic interview with DAG on topic 1 transition
// ─────────────────────────────────────────────
const DEMO_SVG = `<svg width="576" height="208" xmlns="http://www.w3.org/2000/svg" style="font-family:sans-serif;">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
<path d="M0,0 L10,5 L0,10 Z" fill="#4a6fa5"/>
</marker>
</defs>
<path d="M189.5,57.0 C220.7,57.0 270.3,57.0 301.5,57.0" fill="none" stroke="#4a6fa5" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="245.5" y="51.0" text-anchor="middle" font-size="10" fill="#6b7fa8">leads to</text>
<path d="M189.5,151.0 C220.7,151.0 270.3,57.0 301.5,57.0" fill="none" stroke="#4a6fa5" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="245.5" y="98.0" text-anchor="middle" font-size="10" fill="#6b7fa8">causes</text>
<path d="M189.5,151.0 C220.7,151.0 270.3,151.0 301.5,151.0" fill="none" stroke="#4a6fa5" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="245.5" y="145.0" text-anchor="middle" font-size="10" fill="#6b7fa8">results in</text>
<path d="M456.5,57.0 C487.7,57.0 510.0,104.0 510.0,104.0" fill="none" stroke="#4a6fa5" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M456.5,151.0 C487.7,151.0 510.0,104.0 510.0,104.0" fill="none" stroke="#4a6fa5" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="22.0" y="34.0" width="155" height="46" rx="6" fill="#2563a8" stroke="#2563a8" stroke-width="1.5"/>
<text x="99.5" y="61.8" text-anchor="middle" font-size="12" font-weight="600" fill="white">Fehlende</text>
<text x="99.5" y="75.8" text-anchor="middle" font-size="12" font-weight="600" fill="white">Unterstützung</text>
<rect x="22.0" y="128.0" width="155" height="46" rx="6" fill="#2563a8" stroke="#2563a8" stroke-width="1.5"/>
<text x="99.5" y="148.8" text-anchor="middle" font-size="12" font-weight="600" fill="white">Hohe</text>
<text x="99.5" y="162.8" text-anchor="middle" font-size="12" font-weight="600" fill="white">Mietpreise</text>
<rect x="299.0" y="34.0" width="155" height="46" rx="6" fill="#dbeafe" stroke="#2563a8" stroke-width="1.5"/>
<text x="376.5" y="55.8" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a5f">Wohnungsverlust</text>
<rect x="299.0" y="128.0" width="155" height="46" rx="6" fill="#dbeafe" stroke="#2563a8" stroke-width="1.5"/>
<text x="376.5" y="148.8" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a5f">Psychische</text>
<text x="376.5" y="162.8" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a5f">Belastung</text>
<rect x="476.0" y="81.0" width="155" height="46" rx="6" fill="#dbeafe" stroke="#2563a8" stroke-width="1.5"/>
<text x="553.5" y="101.8" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a5f">Dauerhafte</text>
<text x="553.5" y="115.8" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a5f">Obdachlosigkeit</text>
</svg>`;

const DEMO_SCRIPT = [
  // step 0: initial load (user_message == "")
  { message: "Ich bin daran interessiert, mehr darüber zu erfahren, was Sie über Obdachlosigkeit in Berlin denken. Können Sie mir erklären, was Ihrer Meinung nach die Hauptfaktoren oder Gründe sind, warum Menschen obdachlos werden und obdachlos bleiben?" },
  // step 1
  { message: "Das ist interessant. Können Sie mir mehr darüber erzählen, welche Rolle hohe Mietpreise dabei spielen?" },
  // step 2
  { message: "Inwiefern beeinflusst fehlende staatliche Unterstützung Ihrer Meinung nach die Situation?" },
  // step 3: DAG transition
  {
    message: "Passt dieser Graph genau zu Ihrem mentalen Bild? Bitte antworten Sie mit Ja oder Nein. Falls Nein, können Sie kurz erklären, was nicht stimmt.",
    dag_svg: DEMO_SVG,
    dag: {
      nodes: [
        { id: "n1", label: "Fehlende Unterstützung" },
        { id: "n2", label: "Hohe Mietpreise" },
        { id: "n3", label: "Wohnungsverlust" },
        { id: "n4", label: "Psychische Belastung" },
        { id: "n5", label: "Dauerhafte Obdachlosigkeit" }
      ],
      edges: [
        { source: "n1", target: "n3", label: "leads to" },
        { source: "n2", target: "n3", label: "causes" },
        { source: "n2", target: "n4", label: "results in" },
        { source: "n3", target: "n5" },
        { source: "n4", target: "n5" }
      ]
    }
  },
  // step 4: after DAG feedback → transition question
  { message: "Vielen Dank. Lassen Sie uns nun über mögliche Lösungsansätze sprechen. Was denken Sie, welche Maßnahmen könnten helfen, Obdachlosigkeit in Berlin zu reduzieren?" },
  // step 5
  { message: "Sehr interessant. Welche Rolle sehen Sie dabei für den Staat im Vergleich zu privaten Initiativen?" },
  // step 6: closing
  { message: "Gibt es noch etwas, das Sie zum Thema Obdachlosigkeit in Berlin hinzufügen möchten, das wir noch nicht besprochen haben?" },
  // step 7: end
  { message: "Vielen Dank für Ihre Zeit und Ihre wertvollen Einblicke. Das Interview ist damit abgeschlossen." }
];

// ─────────────────────────────────────────────
//  SESSION STATE (mirrors what the backend tracks)
// ─────────────────────────────────────────────
let sessionState = {
  step: 0,
  history: [],
  awaiting_dag_feedback: false,
  topic_dags: []
};

function updatePanel() {
  document.getElementById('sessionPanel').textContent =
    JSON.stringify(sessionState, null, 2);
}

function recordHistory(role, content) {
  sessionState.history.push({ role, content, time: new Date().toISOString() });
  updatePanel();
}

// ─────────────────────────────────────────────
//  MOCK API — returns a Promise<data>
// ─────────────────────────────────────────────
function mockApiCall(userMessage) {
  return new Promise((resolve) => {
    setTimeout(() => {
      // DAG feedback handling
      if (sessionState.awaiting_dag_feedback) {
        let accepted = null, correction = null;
        if (userMessage.startsWith('__DAG_ACCEPTED__')) {
          accepted = true;
        } else if (userMessage.startsWith('__DAG_REJECTED__::')) {
          accepted = false;
          correction = userMessage.slice('__DAG_REJECTED__::'.length);
        }
        // Attach feedback to last dag entry
        if (sessionState.topic_dags.length > 0) {
          const last = sessionState.topic_dags[sessionState.topic_dags.length - 1];
          last.accepted = accepted;
          last.correction = correction;
        }
        sessionState.awaiting_dag_feedback = false;
        updatePanel();
        // Return the transition question (step 4)
        const resp = DEMO_SCRIPT[4];
        recordHistory('assistant', resp.message);
        resolve(resp);
        return;
      }

      const resp = DEMO_SCRIPT[sessionState.step] || DEMO_SCRIPT[DEMO_SCRIPT.length - 1];
      recordHistory('assistant', resp.message);

      if (resp.dag) {
        sessionState.awaiting_dag_feedback = true;
        sessionState.topic_dags.push({
          topic: "Ursachen der Obdachlosigkeit",
          dag: resp.dag,
          svg: "(svg omitted for brevity)",
          accepted: null,
          correction: null
        });
        updatePanel();
      }

      sessionState.step++;
      resolve(resp);
    }, 800); // simulate network delay
  });
}

// ─────────────────────────────────────────────
//  LIVE API — calls real localhost backend
// ─────────────────────────────────────────────
const USER_ID = 'test-user-' + Math.random().toString(36).slice(2, 8);
const INTERVIEW_ID = 'HOMELESS_BERLIN';

function liveApiCall(userMessage) {
  const endpoint = document.getElementById('endpointInput').value.trim();
  return fetch(endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      route: 'next',
      payload: { user_message: userMessage, session_id: USER_ID, interview_id: INTERVIEW_ID }
    })
  }).then(r => r.json());
}

function apiCall(userMessage) {
  const mode = document.getElementById('modeSelect').value;
  if (userMessage !== '') recordHistory('user', userMessage);
  return mode === 'demo' ? mockApiCall(userMessage) : liveApiCall(userMessage);
}

// ─────────────────────────────────────────────
//  CHAT UI (same logic as Qualtrics.js)
// ─────────────────────────────────────────────
const chatArea = document.getElementById('chatArea');
const submitButton = document.getElementById('submitButton');
const inputField = document.getElementById('inputBox');

function appendChatbotMessage(message, status) {
  const el = document.createElement('div');
  el.style.cssText = "word-wrap:break-word; width:80%; border:1px solid #F6F6F6; border-radius:5px; padding:5px; margin-bottom:10px; background:#F6F6F6; display:block; margin-right:auto; font-size:18px; line-height:1.5;";

  if (status === 'waiting') {
    el.innerHTML = `<div id="wave" style="text-align:left;">
      <span style="display:inline-block;width:12px;height:6px;border-radius:50%;margin-right:3px;background:#303131;animation:wave 1.3s linear infinite;"></span>
      <span style="display:inline-block;width:12px;height:6px;border-radius:50%;margin-right:3px;background:#303131;animation:wave 1.3s linear infinite;animation-delay:-1.1s;"></span>
      <span style="display:inline-block;width:12px;height:6px;border-radius:50%;margin-right:3px;background:#303131;animation:wave 1.3s linear infinite;animation-delay:-0.9s;"></span>
      </div><style>@keyframes wave{0%,60%,100%{transform:initial;}30%{transform:translateY(-7px);}}</style>`;
    el.id = 'dancingDots';
  } else {
    const existing = document.getElementById('dancingDots');
    if (existing) { existing.innerText = message.trim(); existing.removeAttribute('id'); chatArea.scrollTop = chatArea.scrollHeight; return; }
    el.innerText = message.trim();
  }
  chatArea.appendChild(el);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function appendUserMessage(text) {
  const el = document.createElement('div');
  el.style.cssText = "display:inline-block; max-width:80%; border:1px solid #ddd; border-radius:5px; padding:5px; margin-bottom:10px; background:#ddd; word-wrap:break-word; font-size:18px; line-height:1.5;";
  el.innerText = text;
  chatArea.appendChild(el);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function restoreInput() {
  submitButton.disabled = false;
  submitButton.style.backgroundColor = '#007AC0';
  submitButton.innerText = 'Submit response';
  inputField.disabled = false;
}

function showDagValidation(dagSvg, question) {
  submitButton.disabled = true;
  submitButton.style.backgroundColor = '#ccc';
  inputField.disabled = true;

  const existing = document.getElementById('dancingDots');
  if (existing) existing.remove();

  const wrap = document.createElement('div');
  wrap.style.cssText = "width:90%; margin-bottom:10px; margin-right:auto;";

  // SVG
  const svgBox = document.createElement('div');
  svgBox.style.cssText = "overflow-x:auto; border:1px solid #d0d7e3; border-radius:6px; padding:8px; background:#f8faff; margin-bottom:10px;";
  svgBox.innerHTML = dagSvg;
  wrap.appendChild(svgBox);

  // Question text
  const qEl = document.createElement('div');
  qEl.style.cssText = "font-size:18px; line-height:1.5; margin-bottom:10px; color:#1e3a5f; font-weight:500;";
  qEl.innerText = question;
  wrap.appendChild(qEl);

  // Buttons
  const row = document.createElement('div');
  row.style.cssText = "display:flex; gap:10px; margin-bottom:10px;";
  const yesBtn = document.createElement('button');
  yesBtn.innerText = 'Ja';
  yesBtn.style.cssText = "padding:8px 28px; font-size:16px; background:#2563a8; color:white; border:none; border-radius:5px; cursor:pointer;";
  const noBtn = document.createElement('button');
  noBtn.innerText = 'Nein';
  noBtn.style.cssText = "padding:8px 28px; font-size:16px; background:#e5e7eb; color:#1e3a5f; border:none; border-radius:5px; cursor:pointer;";
  row.appendChild(yesBtn); row.appendChild(noBtn);
  wrap.appendChild(row);

  // Correction area
  const corrArea = document.createElement('div');
  corrArea.style.display = 'none';
  corrArea.innerHTML = `
    <textarea id="dagCorrText" placeholder="Bitte beschreiben Sie kurz, was nicht stimmt..."
      style="width:100%;height:80px;font-size:16px;border:1px solid #ccc;border-radius:5px;padding:6px;box-sizing:border-box;resize:vertical;"></textarea>
    <button id="dagCorrSubmit" style="margin-top:6px;padding:8px 20px;font-size:16px;background:#2563a8;color:white;border:none;border-radius:5px;cursor:pointer;">Absenden</button>
  `;
  wrap.appendChild(corrArea);
  chatArea.appendChild(wrap);
  chatArea.scrollTop = chatArea.scrollHeight;

  yesBtn.addEventListener('click', () => { wrap.remove(); sendDagFeedback('__DAG_ACCEPTED__', 'Ja'); });
  noBtn.addEventListener('click', () => { corrArea.style.display = 'block'; yesBtn.disabled = true; noBtn.disabled = true; chatArea.scrollTop = chatArea.scrollHeight; });
  corrArea.querySelector('#dagCorrSubmit').addEventListener('click', () => {
    const txt = corrArea.querySelector('#dagCorrText').value.trim();
    if (!txt) return;
    wrap.remove();
    sendDagFeedback('__DAG_REJECTED__::' + txt, 'Nein – ' + txt);
  });
}

function sendDagFeedback(sentinel, label) {
  appendUserMessage(label);
  appendChatbotMessage('', 'waiting');
  apiCall(sentinel).then(handleResponse).catch(handleError);
}

function handleResponse(data) {
  const msg = data.message.trim();
  const dagSvg = data.dag_svg || null;

  if (msg.indexOf('---END---') !== -1) {
    const clean = msg.replace('---END---', '').trim();
    appendChatbotMessage(clean, 'response');
    submitButton.disabled = true;
    submitButton.innerText = 'End of interview';
    inputField.disabled = true;
    return;
  }

  if (dagSvg) {
    const existing = document.getElementById('dancingDots');
    if (existing) existing.remove();
    showDagValidation(dagSvg, msg);
  } else {
    appendChatbotMessage(msg, 'response');
    restoreInput();
  }

  // Update panel for live mode too
  if (document.getElementById('modeSelect').value === 'live') {
    sessionState.history.push({ role: 'assistant', content: msg });
    if (data.dag) sessionState.topic_dags.push({ dag: data.dag, accepted: null, correction: null });
    updatePanel();
  }
}

function handleError(err) {
  console.error(err);
  appendChatbotMessage('Fehler beim Laden. Bitte erneut versuchen.', 'response');
  restoreInput();
}

// ─────────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────────
function startInterview() {
  chatArea.innerHTML = '&nbsp;';
  sessionState = { step: 0, history: [], awaiting_dag_feedback: false, topic_dags: [] };
  updatePanel();
  appendChatbotMessage('', 'waiting');
  apiCall('').then(data => {
    sessionState.step = 1; // advance past greeting
    handleResponse(data);
  }).catch(handleError);
}

submitButton.addEventListener('click', () => {
  const msg = inputField.value.trim();
  if (!msg) return;
  inputField.value = '';
  submitButton.disabled = true;
  submitButton.style.backgroundColor = '#ccc';
  submitButton.innerText = 'Waiting for reply...';
  inputField.disabled = true;
  appendUserMessage(msg);
  appendChatbotMessage('', 'waiting');
  apiCall(msg).then(handleResponse).catch(handleError);
});

// also submit on Ctrl+Enter
inputField.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') submitButton.click();
});

document.getElementById('resetBtn').addEventListener('click', startInterview);

document.getElementById('modeSelect').addEventListener('change', (e) => {
  const tag = document.getElementById('modeTag');
  if (e.target.value === 'demo') { tag.textContent = 'DEMO'; tag.className = 'demo'; }
  else { tag.textContent = 'LIVE'; tag.className = ''; }
  startInterview();
});

// Boot
startInterview();
</script>
</body>
</html>
